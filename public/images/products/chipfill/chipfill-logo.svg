<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 50" width="210" height="50" role="img" aria-label="ChipFill">
  <defs>
    <linearGradient id="chipfill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>
  <!-- "Chip" — orange→yellow gradient -->
  <text x="0" y="38"
    font-family="system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"
    font-weight="700" font-size="38" letter-spacing="-0.02em"
    fill="url(#chipfill-grad)">Chip</text>
  <!-- "Fill" — off-white, same weight/size — dual-tone series mark -->
  <text x="104" y="38"
    font-family="system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"
    font-weight="700" font-size="38" letter-spacing="-0.02em"
    fill="#F5F0EB">Fill</text>
</svg>
