        - generic [ref=e52]:
          - heading "About ChipFill" [level=2] [ref=e53]
          - paragraph [ref=e54]: ChipFill is a heat-activated preformed pothole repair material engineered for permanent restoration of road surface damage. The material is laid into the prepared excavation and activated with a propane heat torch — no specialized equipment, no hot-mix plant, no aggregate batching. Once heated, ChipFill conforms to the contours of the damage and bonds chemically to the surrounding asphalt or concrete, sealing the substrate from the water intrusion that accelerates freeze-thaw damage and turns minor surface defects into deep structural failures. Deployable year-round regardless of temperature or weather conditions — a critical advantage in Canadian climates where hot-mix asphalt plants close seasonally and potholes peak in early spring. Sets rapidly so the lane can reopen to traffic within minutes of application. Specified by Canadian municipalities and road maintenance contractors for routine patrol patching, emergency response programs, utility cut restoration, edge joint repair, and pedestrian infrastructure maintenance across roads, parking lots, sidewalks, and pathways.
