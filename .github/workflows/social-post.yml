name: Social Copy Generator (v2)

# ─────────────────────────────────────────────────────────────────────────────
# Triggers whenever a blog MDX file is pushed to main.
# Runs .github/scripts/generate-social.js for each changed file, writes a
# companion .social.json, and outputs a formatted summary to the Actions UI.
#
# STATUS: DISABLED — remove the `if: false` line below when ready to enable.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
    paths:
      - "content/blog/**.mdx"

jobs:
  generate-social-copy:
    # ⚠️  Remove this line to enable the workflow
    if: false
    name: Generate social copy for updated blog posts
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to commit .social.json files back

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2

      # ── 2. Node + dependencies ───────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      # ── 3. Detect changed MDX files ──────────────────────────────────────────
      - name: Detect changed blog MDX files
        id: changed
        run: |
          FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'content/blog/**.mdx' | tr '\n' '|')
          echo "files=${FILES}" >> "$GITHUB_OUTPUT"
          echo "Changed files: ${FILES}"

      # ── 4. Generate social copy for each changed file ────────────────────────
      - name: Run generate-social.js
        if: steps.changed.outputs.files != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          # Split pipe-separated list back into individual paths
          IFS='|' read -ra MDX_FILES <<< "$CHANGED_FILES"

          SUMMARY_BODY=""

          for FILE in "${MDX_FILES[@]}"; do
            FILE=$(echo "$FILE" | tr -d '[:space:]')
            [ -z "$FILE" ] && continue

            echo ""
            echo "▶ Processing: $FILE"

            # Run the generator; non-zero exit is caught — build never fails
            if node .github/scripts/generate-social.js "$FILE"; then
              SLUG=$(basename "$FILE" .mdx)
              OUT="content/blog/${SLUG}.social.json"

              if [ -f "$OUT" ]; then
                LINKEDIN=$(node -e "const d=require('./${OUT}');process.stdout.write(d.linkedin.slice(0,120)+'…')" 2>/dev/null || echo "(see file)")
                SUMMARY_BODY="${SUMMARY_BODY}
          ### 📄 \`${FILE}\`
          | Platform | Preview |
          |----------|---------|
          | LinkedIn | ${LINKEDIN} |
          | Instagram | *(see \`${OUT}\`)* |
          | Twitter | *(see \`${OUT}\`)* |
          "
              fi
            else
              echo "  ⚠️  generate-social.js exited non-zero for ${FILE} — skipping."
              SUMMARY_BODY="${SUMMARY_BODY}
          ### ⚠️ \`${FILE}\` — generation failed (check logs)
          "
            fi
          done

          # Write to GitHub Actions job summary
          echo "## 🗣️ Social Copy Generation Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$SUMMARY_BODY" >> "$GITHUB_STEP_SUMMARY"

      # ── 5. Commit generated .social.json files ───────────────────────────────
      - name: Commit social copy files
        if: steps.changed.outputs.files != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add 'content/blog/*.social.json'

          if git diff --cached --quiet; then
            echo "No .social.json files changed — nothing to commit."
          else
            git commit -m "chore(social): auto-generate social copy [skip ci]"
            git push
            echo "✅ Social copy committed and pushed."
          fi
