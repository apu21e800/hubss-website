# Runs the safety net on every push and PR.
#
# This repo had no CI, no tests, and no test runner until now — 141 pages, a
# live client site, and nothing that could tell anyone when something broke.
# Every check in scripts/verify-site.mjs exists because a real bug shipped and
# sat on production for weeks before a human happened to find it.
#
# The job is deliberately cheap: build once, run the checks, done. If it starts
# taking long enough that people want to skip it, it has failed at its job.
name: verify

on:
  push:
    branches: [main, v2, "feat/**", "fix/**", "integrate/**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_TURBOPACK_EXPERIMENTAL_USE_SYSTEM_TLS_CERTS: "1"

      # After Build, not before. Four files the code imports — lib/map-count.json,
      # gallery-manifest.json, map-blog-projects.json, document-sizes.json — are
      # gitignored and written by the generator scripts that `npm run build`
      # runs first. Typechecking a fresh checkout before they exist failed with
      # TS2307 on every push from 17 Sep, so this job never reached Verify.
      - name: Typecheck
        run: npx tsc --noEmit

      # The forms' spam rules (lib/form-screen.ts): a change that starts
      # holding back real enquiries fails here. No network, a second or two.
      - name: Form screen tests
        run: npm run test:forms

      # The social pipeline's rules, the Insights planner's vetting and the
      # project-post workflow's scheduling and documents (lib/social-outcome.ts,
      # lib/social-library.ts, lib/insights-planner.ts, lib/project-posts.ts).
      # No network.
      - name: Social, planner and project-post tests
        run: npm run test:social && npm run test:planner && npm run test:project-posts

      # The Product Book edition covers every printed page exactly once and every
      # leaf's links resolve (lib/idea-book-edition.ts).
      - name: Product Book edition test
        run: npm run test:idea-book

      # Google Analytics loads for people, never for a browser driven by a
      # program, and never skips a person (lib/automated-browser.ts).
      - name: Analytics gate test
        run: npm run test:analytics

      # Old spec-sheet addresses land on today's PDF (lib/legacy-doc-redirects.ts).
      - name: Spec-sheet redirects test
        run: npm run test:redirects

      # The lead the server sends GA4 for a delivered message: its shape,
      # nothing personal in it, and the visitor's ids read from GA's cookies
      # (lib/ga4-lead.ts, lib/post-form.ts). No network.
      - name: GA4 lead test
        run: npm run test:ga4

      # The fast checks: routes, links, assets, gallery distinctness, and the
      # CMS field contract. No browser, so this is the one that gates merges.
      - name: Verify
        run: npm run verify -- --quick

      # Browser checks (accessibility + image weight) are heavier and need
      # Chromium, so they run but don't block — a11y regressions get reported
      # rather than silently merged.
      - name: Install browser
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Accessibility and image weight
        run: npm run verify
        continue-on-error: true
