- name: Splash Pads.
  image: assets/booklet/Splash Pad 1.png
  blurb: Slip-resistant, cool-touch coloured surfaces for the places where children spend the most concentrated hours of their year.
- name: Sport Courts.
  image: assets/booklet/school sport court 1.png
  blurb: Custom-coloured, line-marked, durable sport surfaces for schools, parks, and community centres.
- name: Driveways.
  image: assets/booklet/StreetPrin Driveway 1.png
  blurb: Decorative finishes that turn private driveways into curbside design statements.
- name: Bike Routes.
  image: ../public/images/applications/bike-lanes/bike-lanes-12.jpg
  blurb: High-contrast coloured surfaces that improve modal clarity and reinforce Complete Streets principles.
