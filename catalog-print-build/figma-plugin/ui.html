<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: Inter, system-ui, -apple-system, sans-serif; margin: 0; padding: 16px; background: #fff; }
    h2 { margin: 0 0 6px; font-size: 14px; }
    p { font-size: 12px; color: #666; line-height: 1.5; margin: 4px 0 14px; }
    button { background: #18a0fb; color: #fff; border: 0; padding: 12px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; width: 100%; font-weight: 600; }
    button:hover { background: #0d8ce8; }
    button.secondary { background: #f5f5f5; color: #333; margin-top: 8px; font-weight: 400; }
    .meta { font-size: 11px; color: #999; padding: 10px 0; border-top: 1px solid #eee; margin-top: 14px; }
  </style>
</head>
<body>
  <h2>HUBSS Catalogue 2026</h2>
  <p>Generates 100 native Figma frames. Catalogue data is embedded — just click Build.</p>

  <button id="build">Build catalogue (100 frames)</button>
  <button class="secondary" id="cancel">Cancel</button>

  <div class="meta">
    Each photo position is a beige <code>[PHOTO]</code> rectangle. Drop your photos into them after the layout finishes.
  </div>

  <script>
    document.getElementById('build').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'build' } }, '*');
    };
    document.getElementById('cancel').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*');
    };
  </script>
</body>
</html>
