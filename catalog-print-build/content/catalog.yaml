  subhead: ''
inside_front:
  hero_image: assets/booklet/HUB Catalogue 2024 (walking) 1.png
  quote: Pavement is not a small thing. It is the surface a city walks on.
manifesto:
  eyebrow: A Word From HUB
  headline: Surfaces, in service of the public.
  body: For thirty years we have built the ground beneath Canada's most lived-on streets. Crosswalks. Plazas. Bus lanes. Runways. We do not make pavement. We make the public realm.
  signature: HUB Surface Systems / Established 1994
